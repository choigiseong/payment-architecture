<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<h1>결제</h1>
<div class="card">
    <ul id="checkout-lines" class="summary-list"></ul>
    <div class="total-row"><span>합계</span><span id="checkout-total">0원</span></div>
</div>
<button type="button" id="pay-button" class="btn btn-primary btn-block" onclick="pay()">결제</button>
<p id="pay-error" class="muted" style="color: var(--danger); display:none"></p>

<script>
    function renderSummary() {
        const cart = getCart();
        document.getElementById("checkout-lines").innerHTML = cart.map(line =>
            `<li>${line.name} x ${line.quantity} = ${line.price * line.quantity}원</li>`
        ).join("");
        document.getElementById("checkout-total").textContent = cartTotal(cart) + "원";
    }

    function pay() {
        const cart = getCart();
        if (cart.length === 0) {
            alert("장바구니가 비어 있습니다");
            return;
        }
        if (!confirm(`총 ${cartTotal(cart)}원을 결제하시겠습니까?`)) {
            return;
        }
        const paymentKey = crypto.randomUUID();
        const body = {
            companySeq: COMPANY_SEQ,
            orderKey: getOrderKey(),
            paymentKey: paymentKey,
            orderName: "장바구니 결제",
            totalPrice: cartTotal(cart),
            items: cart.map(line => ({ itemName: line.name, unitPrice: line.price, quantity: line.quantity })),
        };
        document.getElementById("pay-button").disabled = true;
        document.getElementById("pay-error").style.display = "none";
        fetchWithTimeout("/api/payments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        }, 35000)
            .then(() => {
                clearCart();
                window.location.href = `/checkout/result?paymentKey=${encodeURIComponent(paymentKey)}`;
            })
            .catch(() => {
                document.getElementById("pay-button").disabled = false;
                const error = document.getElementById("pay-error");
                error.textContent = "네트워크 오류로 결제 요청을 보내지 못했습니다. 다시 시도해 주세요.";
                error.style.display = "block";
            });
    }

    renderSummary();
</script>
</body>
</html>
