<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<h1>결제</h1>
<div class="card">
    <ul id="checkout-lines" class="summary-list"></ul>
    <div class="total-row"><span>합계</span><span id="checkout-total">0원</span></div>
    <p id="delivery-date" class="muted"></p>
</div>
<button type="button" id="pay-button" class="btn btn-primary btn-block" onclick="pay()">결제</button>
<p id="pay-error" class="muted" style="color: var(--danger); display:none"></p>

<script>
    // 배송 보장일과 금액은 서버가 계산해 내려준다. 화면 표시와 결제 요청이 모두 이 값을 쓰므로
    // 클라이언트가 계산 규칙을 복제하지 않아도 되고, 브라우저 시계와 어긋날 일도 없다.
    let preview = null;

    function loadPreview() {
        const cart = getCart();
        if (cart.length === 0) {
            showPayError("장바구니가 비어 있습니다.");
            return Promise.resolve();
        }
        return fetchWithTimeout("/api/checkout/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: cart.map(line => ({ productId: line.productId, quantity: line.quantity })) }),
        }, 10000)
            .then(res => (res.ok ? res.json() : Promise.reject()))
            .then(result => {
                preview = result;
                renderPreview();
            })
            // 서버 오류든 타임아웃이든 화면은 빈 채로 남는다. 이유를 알리지 않으면
            // 사용자는 장바구니가 비었다고 오해하고 복구할 방법도 없다.
            .catch(() => showPayError("주문 정보를 불러오지 못했습니다. 새로고침해 주세요."));
    }

    function renderPreview() {
        document.getElementById("checkout-lines").innerHTML = preview.items.map(line =>
            `<li>${line.name} ${line.unitPrice}원 x ${line.quantity} = ${line.lineTotal}원</li>`
        ).join("");
        document.getElementById("checkout-total").textContent = preview.totalPrice + "원";
        const [, month, day] = preview.deliveryDate.split("-");
        document.getElementById("delivery-date").textContent = `${Number(month)}월 ${Number(day)}일 도착 보장`;
    }

    function showPayError(message) {
        document.getElementById("pay-button").disabled = false;
        const error = document.getElementById("pay-error");
        error.textContent = message;
        error.style.display = "block";
    }

    function goResult(paymentKey) {
        window.location.href = `/checkout/result?paymentKey=${encodeURIComponent(paymentKey)}`;
    }

    function pay() {
        if (preview === null) {
            showPayError("주문 정보를 불러오지 못했습니다. 새로고침해 주세요.");
            return;
        }
        if (!confirm(`총 ${preview.totalPrice}원을 결제하시겠습니까?`)) {
            return;
        }
        const paymentKey = crypto.randomUUID();
        // 항목·금액·보장일 모두 화면에 보여준 값, 즉 서버가 내려준 미리보기를 그대로 싣는다.
        // 여기서 장바구니를 다시 읽거나 계산하면 화면과 요청이 어긋나 검증이 무의미해진다.
        const body = {
            companySeq: COMPANY_SEQ,
            orderKey: getOrderKey(),
            paymentKey: paymentKey,
            orderName: "장바구니 결제",
            totalPrice: preview.totalPrice,
            deliveryDate: preview.deliveryDate,
            items: preview.items.map(line => ({ productId: line.productId, quantity: line.quantity })),
        };
        document.getElementById("pay-button").disabled = true;
        document.getElementById("pay-error").style.display = "none";
        fetchWithTimeout("/api/payments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        }, 35000)
            .then(res => {
                if (res.ok) {
                    return res.json().then(result => handlePayResult(result, paymentKey));
                }
                // 서버가 오류를 반환했다. Toss 호출 전에 끊겼으므로 청구는 일어나지 않았다.
                // 본문이 ProblemDetail이 아닐 수도 있어(핸들러 없는 500) 파싱 실패는 기본 문구로 떨어뜨린다.
                return res.json().catch(() => ({})).then(problem => handlePayError(problem));
            })
            .catch(() => {
                // 타임아웃/네트워크 오류: 접수 여부를 알 수 없으므로 장바구니는 그대로 두고
                // 결과 페이지에서 폴링하며 실제 상태를 확인한다.
                goResult(paymentKey);
            });
    }

    function handlePayError(problem) {
        if (problem.type === "4092") {
            // 마감을 넘겨 보장일이 바뀌었다. 장바구니는 그대로 두고 새 값을 받아 화면을 갱신한다.
            loadPreview();
            showPayError(problem.detail);
            return;
        }
        if (problem.type === "4091") {
            // 이미 결제된 주문은 같은 장바구니로 재시도해도 계속 막히므로 비운다(orderKey도 함께 무효화된다).
            clearCart();
        }
        showPayError(problem.detail ?? "결제 요청을 처리하지 못했습니다. 다시 시도해 주세요.");
    }

    function handlePayResult(result, paymentKey) {
        if (result.paymentStatus === "FAILED") {
            // 서버가 확정한 실패. 장바구니와 orderKey를 유지해 바로 재시도할 수 있게 한다.
            showPayError(result.message ?? "결제에 실패했습니다.");
            return;
        }
        if (result.paymentStatus === "SUCCESS") {
            clearCart();
        }
        // 성공이거나 아직 미확정(PENDING)이면 결과 페이지에서 확인한다.
        // 이미 진행 중인 거래가 있으면 서버가 그 거래의 paymentKey를 돌려주므로,
        // 방금 만든 키가 아니라 응답의 키로 조회해야 한다.
        goResult(result.paymentKey ?? paymentKey);
    }

    loadPreview();
</script>
</body>
</html>
