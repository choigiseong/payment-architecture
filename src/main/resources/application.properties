spring.application.name=payment

spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 지정하지 않으면 플랫폼 기본 charset으로 읽어 data.sql의 한글이 깨진다.
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Bean Validation 실패 등 스프링 내장 예외도 ProblemDetail로 응답해 클라이언트가 detail 하나만 읽으면 되도록 한다.
spring.mvc.problemdetails.enabled=true

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-handlers-package=com.coco.payment.persistence.converter
mybatis.type-aliases-package=com.coco.payment.persistence.model

payment.toss.base-url=https://api.tosspayments.com
payment.toss.secret-key=${TOSS_SECRET_KEY:}

payment.pending-timeout-seconds=300
payment.reconciliation.interval-ms=30000
payment.reconciliation.max-window-seconds=1800
