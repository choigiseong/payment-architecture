spring.application.name=payment

spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 지정하지 않으면 플랫폼 기본 charset으로 읽어 data.sql의 한글이 깨진다.
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Bean Validation 실패 등 스프링 내장 예외도 ProblemDetail로 응답해 클라이언트가 detail 하나만 읽으면 되도록 한다.
spring.mvc.problemdetails.enabled=true

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-handlers-package=com.coco.payment.persistence.converter
mybatis.type-aliases-package=com.coco.payment.persistence.model

payment.toss.base-url=https://api.tosspayments.com
payment.toss.secret-key=${TOSS_SECRET_KEY:}

# 미확정 거래를 다시 조회하기까지의 간격. 아래 기한 안에 여러 번 확인한다
payment.reconciliation.recheck-interval-seconds=30
# 거래 생성 후 이 시간이 지나면 확정을 포기하고 취소한다(승인이 성공했더라도)
payment.reconciliation.net-cancel-after-seconds=300
# 이 시각 전 주문은 오늘 배치(내일 도착 보장), 이후는 다음 배치(모레 도착 보장)
payment.delivery.cutoff-hour=22
# 마감 직후 다음날 배송분을 외부 업체로 전달한다
payment.delivery.handoff-cron=0 5 22 * * *
payment.reconciliation.interval-ms=30000
